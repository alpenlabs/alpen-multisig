# A tester's own node in a shared Payout Administrator test round. Regtest only.
# It follows the host's chain and serves the desktop app on this machine through loopback RPC.
regtest=1
server=1
txindex=1

[regtest]
# Replace HOST with the host's LAN address. connect= makes this node talk to the host only.
connect=HOST:18444
# The desktop app's "Local node" mode uses exactly these credentials on 127.0.0.1:18443.
rpcuser=user
rpcpassword=password
rpcport=18443
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# Nobody connects to this node.
listen=0
