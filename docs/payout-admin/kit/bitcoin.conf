# Host node of a shared Payout Administrator test round. Regtest only. Never use with real funds.
# RPC stays on loopback: only the seeder and the coordinator on this machine use it.
# Testers' own nodes connect to this one on the regtest peer-to-peer port 18444.
regtest=1
server=1
txindex=1

[regtest]
# The desktop app's "Local node" mode uses exactly these credentials on 127.0.0.1:18443, so a host
# who is also a tester can use this node directly. Acceptable only on loopback and regtest.
rpcuser=user
rpcpassword=password
rpcport=18443
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# Peer-to-peer for the testers' nodes. Firewall port 18444 to the trusted LAN or VPN.
listen=1
port=18444
# Regtest has no fee estimates. BTC/kvB; used only by Core wallet funding on this node.
fallbackfee=0.00002000
